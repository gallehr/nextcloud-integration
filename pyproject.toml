[project]
name = "nextcloud_integration"
authors = [
    { name = "Frappe", email = "developers@frappe.io" }
]
description = "Frappe App for NextCloud Backup"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pypika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.urls]
Repository = "https://github.com/gallehr/nextcloud-integration.git"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
